<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#214d3c"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="藥理學與生藥學手機閃卡。依回想表現安排複習；題庫可分享，各科進度只存在自己的裝置。">
  <title>每日回想・藥理與生藥</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="storage-warning" class="notice warning" hidden role="alert"></div>
  <div id="app"><main class="loading"><div class="brandmark">回</div><h1>每日回想</h1><p>正在準備你的題庫…</p></main></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="image-dialog"><div class="dialog-head"><strong>原題圖片</strong><button data-zoom="-" aria-label="縮小圖片">−</button><button data-zoom="+" aria-label="放大圖片">＋</button><button id="close-image" aria-label="關閉圖片">✕</button></div><p class="muted">點＋放大，左右滑動查看；也可使用手機雙指縮放。</p><div class="zoom-area"><img id="zoom-image" alt="完整原題圖片"></div></dialog>
  <dialog id="share-dialog" aria-labelledby="share-title"><div class="dialog-head"><strong id="share-title">分享題庫網址</strong><button id="close-share" aria-label="關閉分享視窗">✕</button></div><p class="setting-note">題庫可分享，進度僅存在此裝置瀏覽器，各科分開；換裝置用備份。</p><label class="share-url-label" for="share-url">本題庫網址（不含進度）</label><input id="share-url" type="url" readonly aria-describedby="share-copy-note"><p class="muted" id="share-copy-note"></p><button id="copy-share-link" class="fullbtn primary">複製網址</button></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script type="module" src="./app.mjs"></script>
</body></html>
